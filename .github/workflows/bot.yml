name: Dynamic Visitor Bot

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Campaign Link (URL)'
        required: true
        default: 'https://auctionr.org/4/5a41eae4c9364b8088fd4ff777a02672'
        type: string
      countries:
        description: 'Proxy Countries (comma separated, e.g. us,uk,ca)'
        required: true
        default: 'us,uk,ca,au,nz'
        type: string
      visitor_count:
        description: 'Visitors per Job (e.g. 10)'
        required: true
        default: '10'
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job_id: [1, 2, 3, 4, 5] # ৫টি জব (প্রতিটিতে ১০টি করে হলে মোট ৫০টি ইম্প্রেশন)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          npm install

      - name: Run Puppeteer Bot
        env:
          CAMPAIGN_URL: ${{ github.event.inputs.target_url }}
          COUNTRIES: ${{ github.event.inputs.countries }}
          VISITOR_COUNT: ${{ github.event.inputs.visitor_count }}
          MAX_DATA_MB: 0.2
        run: node index.js

      - name: Upload Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots-job-${{ matrix.job_id }}
          path: screenshot_*.png
