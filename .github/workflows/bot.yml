name: Android Stealth Bot

on:
  workflow_dispatch:
    inputs:
      target_url:     { description: 'Campaign URL', required: true, type: string }
      total_visitors: { description: 'TOTAL visitors', required: true, default: '5', type: string }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Run bot
        env:
          CAMPAIGN_URL: ${{ github.event.inputs.target_url }}
          VISITOR_COUNT: ${{ github.event.inputs.total_visitors }}
        run: node index.js

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            screenshot_*.png
            visitors.jsonl
          retention-days: 7
          if-no-files-found: ignore
