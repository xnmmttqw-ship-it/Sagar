name: Run Puppeteer Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      visitor_count:
        description: 'কতগুলো ভিজিটর চালাতে চান?'
        required: true
        default: '10'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot Script
        env:
          VISITOR_COUNT: ${{ github.event.inputs.visitor_count || 10 }}
        run: node index.js
