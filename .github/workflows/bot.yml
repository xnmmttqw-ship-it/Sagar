name: Dynamic Visitor Bot

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Campaign / Direct Link URL'
        required: true
        default: 'https://auctionr.org/4/5a41eae4c9364b8088fd4ff777a02672'
        type: string
      countries:
        description: 'Proxy Countries (comma separated, e.g. fi,us,uk)'
        required: true
        default: 'fi'
        type: string
      total_visitors:
        description: 'Total Visitors (e.g. 10, 20, 30)'
        required: true
        default: '20'
        type: string

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Calculate Matrix Jobs
        id: set-matrix
        run: |
          TOTAL="${{ github.event.inputs.total_visitors }}"
          JOBS_COUNT=$(( (TOTAL + 9) / 10 ))
          if [ $JOBS_COUNT -lt 1 ]; then JOBS_COUNT=1; fi
          
          MATRIX_JSON=$(python3 -c "import json; print(json.dumps(list(range(1, $JOBS_COUNT + 1))))")
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  run-bot:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job_id: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fix Apt Sources & Update
        run: |
          # মাইক্রোসফট সহ সমস্ত apt সোর্স ফাইলের resolute ভার্সন noble (24.04)-এ রূপান্তর
          sudo find /etc/apt/ -type f -name "*.list" -exec sed -i 's/resolute/noble/g' {} +
          
          # আপডেট কমান্ড রান করা
          sudo apt-get update -o Acquire::Check-Valid-Until=false || true

      - name: Install Google Chrome & Dependencies
        run: |
          sudo apt-get install -y google-chrome-stable
          npm install

      - name: Run Puppeteer Bot
        env:
          CAMPAIGN_URL: ${{ github.event.inputs.target_url }}
          COUNTRIES: ${{ github.event.inputs.countries }}
          VISITOR_COUNT: 10
          MAX_DATA_MB: 0.2
        run: node index.js

      - name: Upload Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots-job-${{ matrix.job_id }}
          path: screenshot_*.png
