name: Dynamic Visitor Bot

on:
  workflow_dispatch:
    inputs:
      visitor_count:
        description: 'Total Visitors'
        required: true
        default: '1'
      countries:
        description: 'Countries (e.g. no, au, nz, us)'
        required: true
        default: 'au, nz'
      campaign_url:
        description: 'Target Campaign URL'
        required: true
        default: 'https://auctionr.org/4/5a41eae4c9364b8088fd4ff777a02672'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          npm install

      - name: Run Puppeteer Bot
        env:
          VISITOR_COUNT: ${{ github.event.inputs.visitor_count || '1' }}
          COUNTRIES: ${{ github.event.inputs.countries || 'au, nz' }}
          CAMPAIGN_URL: ${{ github.event.inputs.campaign_url || 'https://auctionr.org/4/5a41eae4c9364b8088fd4ff777a02672' }}
        run: node index.js

      - name: Upload Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: screenshot_*.png
        if: always()
