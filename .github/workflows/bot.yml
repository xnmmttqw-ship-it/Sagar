name: Dynamic Visitor Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job_id: [1, 2, 3, 4, 5] # ৫টি ম্যাট্রিক্স জব (প্রতিটিতে ১০টি করে সেশন হলে মোট ৫০টি ইম্প্রেশন হবে)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          npm install

      - name: Run Puppeteer Bot
        env:
          VISITOR_COUNT: 10
          COUNTRIES: "us,uk,ca,au,nz"
          MAX_DATA_MB: 0.2
        run: node index.js

      - name: Upload Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots-job-${{ matrix.job_id }}
          path: screenshot_*.png
