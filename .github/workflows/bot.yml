name: Dynamic Norway Visitor Bot

on:
  workflow_dispatch:
    inputs:
      visitor_count:
        description: 'Total Visitors'
        required: true
        default: '1' # এখানে ১ দিয়ে দিন

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # প্রথমে শুধু ১ জন দিয়ে চেক করার জন্য
        worker: [1] 
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Chrome & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          npm install

      - name: Run Puppeteer Bot
        env:
          VISITOR_COUNT: ${{ github.event.inputs.visitor_count || '1' }}
        run: node index.js
