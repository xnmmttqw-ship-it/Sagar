name: Dynamic Visitor Bot

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Campaign / Direct Link URL'
        required: true
        default: 'https://auctionr.org/4/5a41eae4c9364b8088fd4ff777a02672'
        type: string
      countries:
        description: 'Proxy Countries / Username (e.g. oq752bxt5h-country-us)'
        required: true
        default: 'oq752bxt5h-country-us'
        type: string
      total_visitors:
        description: 'Total Visitors (e.g. 5, 10, 20)'
        required: true
        default: '10'
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies & Verify Chrome
        run: |
          # apt-get update বাদ দেওয়া হলো যাতে অতিরিক্ত সময় নষ্ট না হয়
          sudo apt-get install -y google-chrome-stable || true
          npm install

      - name: Run Puppeteer Bot
        env:
          CAMPAIGN_URL: ${{ github.event.inputs.target_url }}
          COUNTRIES: ${{ github.event.inputs.countries }}
          VISITOR_COUNT: ${{ github.event.inputs.total_visitors }}
          MAX_DATA_MB: 10
        run: node index.js

      - name: Upload Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: screenshot_*.png
