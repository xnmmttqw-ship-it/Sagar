name: Dynamic Norway Visitor Bot

on:
  workflow_dispatch:
    inputs:
      visitor_count:
        description: 'Total Visitors'
        required: true
        default: '1'
      countries:
        description: 'Countries (e.g. no, us, ca)'
        required: true
        default: 'no'
      campaign_url:
        description: 'Target Campaign URL'
        required: true
        default: 'https://auctionr.org/4/5a41eae4c9364b8088fd4ff777a02672'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [1] 
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Chrome & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          npm install

      - name: Run Puppeteer Bot
        env:
          VISITOR_COUNT: ${{ github.event.inputs.visitor_count || '1' }}
          COUNTRIES: ${{ github.event.inputs.countries || 'no' }}
          CAMPAIGN_URL: ${{ github.event.inputs.campaign_url || 'https://auctionr.org/4/5a41eae4c9364b8088fd4ff777a02672' }}
        run: node index.js
